<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="title">
  <title id="title">Maximalism watch face</title>
  <defs>
    <clipPath id="face">
      <circle cx="120" cy="120" r="120"/>
    </clipPath>
  </defs>
  <g clip-path="url(#face)">
    <rect width="240" height="240" fill="#000000"/>
    <!-- radius 96, 12 hour dots at 30deg steps; current hour 10 highlighted; minute 10 -->
    <g fill="#ffffff">
      <circle cx="203.14" cy="72" r="5"/>
      <circle cx="216" cy="120" r="5"/>
      <circle cx="203.14" cy="168" r="5"/>
      <circle cx="168" cy="203.14" r="5"/>
      <circle cx="120" cy="216" r="5"/>
      <circle cx="72" cy="203.14" r="5"/>
      <circle cx="36.86" cy="168" r="5"/>
      <circle cx="24" cy="120" r="5"/>
      <circle cx="36.86" cy="72" r="5"/>
      <circle cx="72" cy="36.86" r="5"/>
      <circle cx="168" cy="36.86" r="5"/>
    </g>
    <circle cx="120" cy="24" r="10" fill="#ff0000"/>
    <circle cx="203.14" cy="72" r="5" fill="#ff0000"/>
    <text x="120" y="92" text-anchor="middle" dominant-baseline="middle" fill="#ff0000" font-family="system-ui, -apple-system, sans-serif" font-size="20">85</text>
    <text x="120" y="114" text-anchor="middle" dominant-baseline="middle" fill="#ff0000" font-family="system-ui, -apple-system, sans-serif" font-size="20">72</text>
  </g>
  <circle cx="120" cy="120" r="119" fill="none" stroke="#222222" stroke-width="2"/>
</svg>
