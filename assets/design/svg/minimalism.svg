<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="title">
  <title id="title">Minimalism watch face</title>
  <defs>
    <clipPath id="face">
      <circle cx="120" cy="120" r="120"/>
    </clipPath>
  </defs>
  <g clip-path="url(#face)">
    <rect width="240" height="240" fill="#000000"/>
    <!-- radius = ((120+120)/2)/1.25 = 96, center 120,120; hour 10:10 => 10.1667h, minute 10 -->
    <circle cx="41.39" cy="64.94" r="10" fill="#ff0000"/>
    <circle cx="203.14" cy="72" r="5" fill="#ff0000"/>
    <text x="120" y="105" text-anchor="middle" dominant-baseline="middle" fill="#ff0000" font-family="system-ui, -apple-system, sans-serif" font-size="22">72</text>
  </g>
  <circle cx="120" cy="120" r="119" fill="none" stroke="#222222" stroke-width="2"/>
</svg>
