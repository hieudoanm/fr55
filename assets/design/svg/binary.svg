<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="title">
  <title id="title">Binary watch face</title>
  <defs>
    <clipPath id="face">
      <circle cx="120" cy="120" r="120"/>
    </clipPath>
  </defs>
  <g clip-path="url(#face)">
    <rect width="240" height="240" fill="#000000"/>

    <text x="28" y="100" text-anchor="middle" dominant-baseline="middle" fill="#555555" font-family="system-ui, -apple-system, sans-serif" font-size="20">H</text>
    <circle cx="56" cy="92" r="11" fill="#ff0000"/>
    <circle cx="96" cy="92" r="11" fill="#2e2e2e"/>
    <circle cx="136" cy="92" r="11" fill="#ff0000"/>
    <circle cx="176" cy="92" r="11" fill="#2e2e2e"/>
    <text x="28" y="156" text-anchor="middle" dominant-baseline="middle" fill="#555555" font-family="system-ui, -apple-system, sans-serif" font-size="20">M</text>
    <circle cx="56" cy="148" r="11" fill="#ff0000"/>
    <circle cx="96" cy="148" r="11" fill="#2e2e2e"/>
    <circle cx="136" cy="148" r="11" fill="#ff0000"/>
    <circle cx="176" cy="148" r="11" fill="#2e2e2e"/>
  </g>
  <circle cx="120" cy="120" r="119" fill="none" stroke="#222222" stroke-width="2"/>
</svg>
