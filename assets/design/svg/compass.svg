<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="title">
  <title id="title">Compass watch face</title>
  <defs>
    <clipPath id="face">
      <circle cx="120" cy="120" r="120"/>
    </clipPath>
  </defs>
  <g clip-path="url(#face)">
    <rect width="240" height="240" fill="#000000"/>

    <text x="120.00" y="22.00" text-anchor="middle" dominant-baseline="middle" fill="#ff0000" font-family="system-ui, sans-serif" font-size="30" font-weight="bold">N</text>
    <text x="218.00" y="120.00" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="30" font-weight="bold">E</text>
    <text x="120.00" y="218.00" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="30" font-weight="bold">S</text>
    <text x="22.00" y="120.00" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="30" font-weight="bold">W</text>
    <line x1="120" y1="120" x2="182.35" y2="84.00" stroke="#ff0000" stroke-width="6" stroke-linecap="round"/>
    <circle cx="120" cy="120" r="6" fill="#ff0000"/>
    <line x1="120" y1="120" x2="94.02" y2="135.00" stroke="#555555" stroke-width="3" stroke-linecap="round"/>
    <text x="120" y="228" text-anchor="middle" dominant-baseline="middle" fill="#555555" font-family="system-ui, sans-serif" font-size="18">10:10</text>
  </g>
  <circle cx="120" cy="120" r="119" fill="none" stroke="#222222" stroke-width="2"/>
</svg>
