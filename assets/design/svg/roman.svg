<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="title">
  <title id="title">Roman watch face</title>
  <defs>
    <clipPath id="face">
      <circle cx="120" cy="120" r="120"/>
    </clipPath>
  </defs>
  <g clip-path="url(#face)">
    <rect width="240" height="240" fill="#000000"/>

    <text x="120.00" y="32.00" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" font-family="Georgia, serif" font-size="30">XII</text>
    <text x="208.00" y="120.00" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" font-family="Georgia, serif" font-size="30">III</text>
    <text x="120.00" y="208.00" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" font-family="Georgia, serif" font-size="30">VI</text>
    <text x="32.00" y="120.00" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" font-family="Georgia, serif" font-size="30">IX</text>
    <line x1="120" y1="120" x2="72.49" y2="86.73" stroke="#ff0000" stroke-width="7" stroke-linecap="round"/>
    <line x1="120" y1="120" x2="192.75" y2="78.00" stroke="#ff0000" stroke-width="5" stroke-linecap="round"/>
    <circle cx="120" cy="120" r="5" fill="#ff0000"/>
  </g>
  <circle cx="120" cy="120" r="119" fill="none" stroke="#222222" stroke-width="2"/>
</svg>
