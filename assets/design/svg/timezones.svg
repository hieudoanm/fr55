<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="title">
  <title id="title">TimeZones watch face</title>
  <defs>
    <clipPath id="face">
      <circle cx="120" cy="120" r="120"/>
    </clipPath>
  </defs>
  <g clip-path="url(#face)">
    <rect width="240" height="240" fill="#000000"/>
    <!-- London UTC+0, Saigon local, Melbourne UTC+10 (illustrative 10:10 local/Saigon) -->
    <g fill="#ff0000" font-family="system-ui, -apple-system, sans-serif" font-size="34" text-anchor="middle" dominant-baseline="middle">
      <text x="120" y="78">03:10</text>
      <text x="120" y="120">10:10</text>
      <text x="120" y="162">13:10</text>
    </g>
  </g>
  <circle cx="120" cy="120" r="119" fill="none" stroke="#222222" stroke-width="2"/>
</svg>
