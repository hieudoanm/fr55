<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="title">
  <title id="title">Hands watch face</title>
  <defs>
    <clipPath id="face">
      <circle cx="120" cy="120" r="120"/>
    </clipPath>
  </defs>
  <g clip-path="url(#face)">
    <rect width="240" height="240" fill="#000000"/>
    <!-- hour points to 4, minute points to 8 -->
    <line x1="120" y1="120" x2="192.75" y2="162.00" stroke="#ff0000" stroke-width="6" stroke-linecap="round"/>
    <line x1="120" y1="120" x2="26.47" y2="174.00" stroke="#ff0000" stroke-width="4" stroke-linecap="round"/>
    <circle cx="120" cy="120" r="4" fill="#ff0000"/>
  </g>
  <circle cx="120" cy="120" r="119" fill="none" stroke="#222222" stroke-width="2"/>
</svg>
