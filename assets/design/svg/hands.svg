<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="title">
  <title id="title">Hands watch face</title>
  <defs>
    <clipPath id="face">
      <circle cx="120" cy="120" r="120"/>
    </clipPath>
  </defs>
  <g clip-path="url(#face)">
    <rect width="240" height="240" fill="#000000"/>
    <!-- 10:10 — hour hand at 305deg (len 84), minute hand at 60deg (len 108) -->
    <line x1="120" y1="120" x2="51.19" y2="71.81" stroke="#ff0000" stroke-width="7" stroke-linecap="round"/>
    <line x1="120" y1="120" x2="213.53" y2="66.00" stroke="#ff0000" stroke-width="5" stroke-linecap="round"/>
    <circle cx="120" cy="120" r="5" fill="#ff0000"/>
  </g>
  <circle cx="120" cy="120" r="119" fill="none" stroke="#222222" stroke-width="2"/>
</svg>
