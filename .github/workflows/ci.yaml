name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    paths:
      - "extensions/vscode/**"
      - ".github/workflows/ci.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build VSIX
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: extensions/vscode/pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: extensions/vscode/package.json
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package extension
        run: |
          pnpm exec vsce package --no-dependencies --out monkey-c.vsix
          echo "Built monkey-c.vsix"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: monkey-c
          path: extensions/vscode/monkey-c.vsix
          if-no-files-found: error

  release:
    name: Release VSIX
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download VSIX artifact
        uses: actions/download-artifact@v8
        with:
          name: monkey-c
          path: dist

      - name: Create or update latest release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: latest
          target_commitish: ${{ github.sha }}
          body_path: extensions/vscode/README.md
          files: dist/monkey-c.vsix
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: true
          overwrite_files: true
