name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches: [master]
    paths:
      - 'apps/**'
      - 'crates/**'
      - 'packages/extensions/vscode/**'
      - 'packages/extensions/zed/**'
      - 'packages/landing/**'
      - 'packages/README.md'
      - '.github/workflows/ci.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extension-vscode:
    name: Extension - VS Code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/extensions/vscode
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Build monkey toolchain
        run: cargo build --release --manifest-path ../../../crates/Cargo.toml

      - name: Lint Monkey C sources
        run: ../../../crates/target/release/monkey check ../../..

      - name: Package extension
        run: pnpm exec vsce package --no-dependencies --out monkey-c.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: extension-vscode-vsix
          path: packages/extensions/vscode/monkey-c.vsix
          if-no-files-found: error

  extension-zed:
    name: Extension - Zed
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/extensions/zed
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Test formatter
        run: node --test formatter/

      - name: Validate manifests
        run: python3 -c 'import json,pathlib,tomllib; [json.loads(p.read_text()) for p in pathlib.Path(".").rglob("*.json")]; [tomllib.loads(p.read_text()) for p in pathlib.Path(".").rglob("*.toml")]; print("json/toml ok")'

      - name: Test Jungle grammar
        working-directory: packages/extensions/zed/grammars/tree-sitter-jungle
        run: npx --yes tree-sitter-cli@0.27.1 test

      - name: Check install script
        run: bash -n scripts/install.sh

      # The Zed extension is declarative (no Rust/WASM), so the release
      # artifact is a source zip of the extension directory.
      - name: Package extension
        working-directory: packages/extensions/zed
        run: zip -r monkey-c-zed.zip . -x '*node_modules*' '.git/*'

      - name: Upload extension artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: extension-zed-package
          path: packages/extensions/zed/monkey-c-zed.zip
          if-no-files-found: error

  cli-check:
    name: CLI check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: crates

      - name: Check formatting
        run: cargo fmt --manifest-path crates/Cargo.toml --all -- --check

      - name: Run clippy
        run: cargo clippy --manifest-path crates/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path crates/Cargo.toml --workspace

  cli-build:
    name: CLI build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Release binaries are only needed for the master-branch release job;
    # PRs are covered by the `cli-check` job.
    if: github.event_name != 'pull_request'
    needs: cli-check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: crates

      - name: Build release binary
        run: cargo build --release --manifest-path crates/Cargo.toml -p monkey-cli

      - name: Rename binary for release
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest) mv crates/target/release/monkey monkey-x86_64-unknown-linux-gnu ;;
            macos-latest) mv crates/target/release/monkey monkey-aarch64-apple-darwin ;;
            windows-latest) mv crates/target/release/monkey.exe monkey-x86_64-pc-windows-msvc.exe ;;
          esac

      - name: Upload CLI binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: monkey-cli-${{ matrix.os }}
          path: monkey-*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [extension-vscode, extension-zed, cli-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download VS Code extension artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: extension-vscode-vsix
          path: dist

      - name: Download Zed extension artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: extension-zed-package
          path: dist

      - name: Download CLI binaries
        uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          pattern: monkey-cli-*
          merge-multiple: true

      - name: Delete existing latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          git push origin :refs/tags/latest || true

      - name: Create or update latest release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: latest
          name: 'Monkey C (latest)'
          target_commitish: ${{ github.sha }}
          body_path: RELEASE.md
          files: dist/**
          fail_on_unmatched_files: true
          prerelease: false
          make_latest: true
          overwrite_files: true

  landing-build:
    name: Landing - Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install landing dependencies
        working-directory: packages/landing
        run: pnpm install --frozen-lockfile

      - name: Typecheck landing
        working-directory: packages/landing
        run: pnpm run typecheck

      - name: Lint landing
        working-directory: packages/landing
        run: pnpm run lint

      - name: Build landing (Next.js static export)
        working-directory: packages/landing
        run: pnpm run build

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: packages/landing/out

  landing-deploy:
    name: Landing - Deploy
    needs: landing-build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5.0.1
