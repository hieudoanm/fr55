name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches: [master]
    paths:
      - "apps/**"
      - "scripts/**"
      - "packages/extensions/vscode/**"
      - "packages/extensions/zed/**"
      - "packages/landing/**"
      - "packages/README.md"
      - ".github/workflows/ci.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build VSIX
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/extensions/vscode
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Lint Monkey C sources
        run: node ../../../scripts/monkeyc-tools.js lint

      - name: Package extension
        run: pnpm exec vsce package --no-dependencies --out monkey-c.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: monkey-c
          path: packages/extensions/vscode/monkey-c.vsix
          if-no-files-found: error

  zed:
    name: Validate Zed extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/extensions/zed
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Test formatter
        run: node --test formatter/

      - name: Validate manifests
        run: python3 -c 'import json,pathlib,tomllib; [json.loads(p.read_text()) for p in pathlib.Path(".").rglob("*.json")]; [tomllib.loads(p.read_text()) for p in pathlib.Path(".").rglob("*.toml")]; print("json/toml ok")'

      - name: Test Jungle grammar
        working-directory: packages/extensions/zed/grammars/tree-sitter-jungle
        run: npx --yes tree-sitter-cli@0.27.1 test

      - name: Check install script
        run: bash -n scripts/install.sh

  release:
    name: Release VSIX
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download VSIX artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: monkey-c
          path: dist

      - name: Create or update latest release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: latest
          name: "Monkey C for VS Code (latest)"
          target_commitish: ${{ github.sha }}
          body_path: packages/extensions/vscode/README.md
          files: dist/monkey-c.vsix
          fail_on_unmatched_files: true
          prerelease: false
          make_latest: true
          overwrite_files: true

  landing-build:
    name: Landing - Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: packages/landing

  landing-deploy:
    name: Landing - Deploy
    needs: landing-build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5.0.1
