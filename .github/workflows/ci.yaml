name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apps-build:
    name: Apps - Build PRGs
    runs-on: ubuntu-latest
    # PRG builds need the Connect IQ SDK plus a signing key; the rolling
    # release only ships from master, so PRs skip this job entirely.
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Resolve SDK version
        id: sdk
        run: |
          SDK_JSON=$(curl -fsSL https://developer.garmin.com/downloads/connect-iq/sdks/sdks.json)
          SDK_FILE=$(echo "$SDK_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)[-1]["linux"])')
          SDK_VERSION=$(echo "$SDK_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)[-1]["version"])')
          echo "file=$SDK_FILE" >> "$GITHUB_OUTPUT"
          echo "version=$SDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "SDK $SDK_VERSION -> $SDK_FILE"

      - name: Cache Connect IQ SDK
        id: sdk-cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/connectiq-sdk
          key: connectiq-sdk-${{ steps.sdk.outputs.version }}

      - name: Download Connect IQ SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://developer.garmin.com/downloads/connect-iq/sdks/${{ steps.sdk.outputs.file }}" -o /tmp/ciq-sdk.zip
          mkdir -p ~/connectiq-sdk
          unzip -q /tmp/ciq-sdk.zip -d ~/connectiq-sdk

      - name: Install fr55 device files
        run: |
          mkdir -p ~/.Garmin/ConnectIQ/Devices
          unzip -o -q ci/devices/fr55.zip -d ~/.Garmin/ConnectIQ/Devices

      # A developer_key.der is just a PKCS#8 RSA key — generate a throwaway
      # one per run. Sideloaded PRGs only need *a* valid signature; if these
      # apps are ever published to the Garmin store, sign with the real
      # developer key instead.
      - name: Generate throwaway signing key
        run: |
          openssl genrsa -out "$RUNNER_TEMP/ciq.pem" 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER -in "$RUNNER_TEMP/ciq.pem" -out "$RUNNER_TEMP/developer_key.der" -nocrypt
          rm "$RUNNER_TEMP/ciq.pem"

      - name: Build watchface PRGs
        run: |
          SDK_DIR=$(find "$HOME/connectiq-sdk" -maxdepth 1 -type d -name 'connectiq-sdk-*' | head -1)
          echo "SDK_DIR=$SDK_DIR"
          mkdir -p dist
          for app in hands minimalism maximalism timezones; do
            echo "== building $app"
            make -C "apps/$app" build \
              DEVICE=fr55 \
              SDK="$SDK_DIR" \
              DEVELOPER_KEY="$RUNNER_TEMP/developer_key.der"
            cp "apps/$app/bin/$app.prg" "dist/$app-fr55.prg"
          done

      - name: Upload PRG artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: apps-prg
          path: dist/*.prg
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [apps-build, landing-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.apps-build.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download PRG artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: apps-prg
          path: dist

      - name: Delete existing latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          git push origin :refs/tags/latest || true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: latest
          name: FR55 Watchfaces (latest)
          target_commitish: ${{ github.sha }}
          body_path: RELEASE.md
          files: dist/*.prg
          fail_on_unmatched_files: true
          prerelease: false
          make_latest: true
          overwrite_files: true

  landing-build:
    name: Landing - Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 12.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.1
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install landing dependencies
        working-directory: packages/landing
        run: pnpm install --frozen-lockfile

      - name: Typecheck landing
        working-directory: packages/landing
        run: pnpm run typecheck

      - name: Lint landing
        working-directory: packages/landing
        run: pnpm run lint

      - name: Build landing (Next.js static export)
        working-directory: packages/landing
        run: pnpm run build

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: packages/landing/out

  landing-deploy:
    name: Landing - Deploy
    needs: landing-build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5.0.1
