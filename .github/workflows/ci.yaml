name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    paths:
      - "extensions/vscode/**"
      - ".github/workflows/ci.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build VSIX
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1
        with:
          package_json_file: extensions/vscode/package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
          cache-dependency-path: extensions/vscode/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Package extension
        run: pnpm exec vsce package --no-dependencies --out monkey-c.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: monkey-c
          path: extensions/vscode/monkey-c.vsix
          if-no-files-found: error

  release:
    name: Release VSIX
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download VSIX artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: monkey-c
          path: dist

      - name: Create or update latest release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: latest
          name: latest
          target_commitish: ${{ github.sha }}
          body_path: extensions/vscode/README.md
          files: dist/monkey-c.vsix
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: true
          overwrite_files: true
